<style>
:root{
  --paper:#FCFAF8; --paper-2:#F3EFEB; --card:#FFFFFF;
  --ink:#2E2A33; --ink-2:#6F6877; --ink-3:#A39CA9; --line:#E9E3DE;
  --flame:#E8A33D; --flame-2:#F8D77F; --rec:#E5484D; --danger:#B4373C;
  --kid:#E7B4AA; --kid-deep:#A4564A;
  --serif: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --shadow: 0 1px 2px rgba(46,42,51,.05), 0 10px 28px -14px rgba(46,42,51,.28);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
svg{display:block}
p{margin:0}

/* ---------- views */
#views{position:fixed;inset:0;max-width:620px;margin:0 auto;overflow:hidden;background:var(--paper)}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);
  padding:calc(var(--sat) + 6px) 20px calc(var(--sab) + 48px);
  transition:transform .44s var(--ease), opacity .44s var(--ease)}
.view.from-right{transform:translateX(100%)}
.view.to-left{transform:translateX(-24%);opacity:.5}
.view.behind{visibility:hidden}
.view.fade-in{animation:fadeIn .5s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bar{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin:0 -10px 6px}
.back{display:inline-flex;align-items:center;gap:0;padding:8px 10px 8px 4px;border-radius:12px;font-size:17px;color:var(--ink)}
.back svg{width:26px;height:26px}
.back:active{opacity:.5}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink);flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:var(--paper-2)}
.text-btn{font-weight:600;padding:10px 12px;border-radius:12px}
.text-btn:active{opacity:.5}
.link{font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

/* ---------- buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;text-align:center;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.soft{background:var(--paper-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn + .btn{margin-top:10px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:0}

/* ---------- home */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px;margin-bottom:24px}
.today{color:var(--ink-3);font-size:15px}
.app-title{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.08;letter-spacing:-.01em;margin:4px 0 0}
.kids{display:grid;gap:22px 14px;grid-template-columns:1fr 1fr;align-items:start}
.kids.n1{grid-template-columns:1fr}
.kid{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;text-align:left}
.kid-photo{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:var(--kid);box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.kids.n1 .kid-photo{aspect-ratio:4/3}
.kid:active .kid-photo{transform:scale(.97)}
.kid-photo img{width:100%;height:100%;object-fit:cover}
.kid.bday .kid-photo{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--flame),var(--shadow)}
.initial{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:64px;color:var(--kid-deep);font-weight:400}
.kid-name{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;margin-top:12px}
.kid-age{color:var(--ink-2);font-size:15px;margin-top:3px}
.kid-soon{color:var(--kid-deep);font-size:15px;font-weight:600;margin-top:2px}
.due{margin-top:22px}
.due .btn{background:var(--kid-deep);color:#fff}
.due .btn + .btn{margin-top:10px}

/* candles */
.candles{display:flex;align-items:flex-end;gap:5px;height:30px;margin-top:9px;overflow:hidden}
.candle{position:relative;flex:none;width:6px;height:16px;border-radius:2px 2px 1px 1px;
  background:repeating-linear-gradient(135deg,var(--kid) 0 3px,rgba(255,255,255,.6) 3px 5px)}
.candle::before{content:"";position:absolute;left:50%;top:-4px;width:1.4px;height:4px;margin-left:-.7px;background:var(--ink-3);border-radius:1px}
.candle i{display:none}
.candle.lit i{display:block;position:absolute;left:50%;bottom:calc(100% + 2px);width:7px;height:10px;margin-left:-3.5px;
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 72%,var(--flame-2) 0 32%,var(--flame) 72%);transform-origin:50% 90%}
.candle.lit.now i{animation:flicker 2.6s ease-in-out infinite}
.candle.ghost{opacity:.35}
.candles.lg{height:44px;gap:7px}
.candles.lg .candle{width:9px;height:26px}
.candles.lg .candle.lit i{width:10px;height:14px;margin-left:-5px}
.candles.xl{height:84px;gap:12px;justify-content:center}
.candles.xl .candle{width:14px;height:48px;border-radius:3px 3px 2px 2px}
.candles.xl .candle::before{top:-7px;height:7px;width:2px;margin-left:-1px}
.candles.xl .candle.lit i{width:16px;height:24px;margin-left:-8px;bottom:calc(100% + 4px)}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}35%{transform:scale(1.07,.94) rotate(2deg)}65%{transform:scale(.95,1.06) rotate(-1deg)}}

/* watch me grow entry */
.grow-card{display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:center;width:100%;text-align:left;margin-top:30px;padding:16px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.grow-card:active{transform:scale(.98)}
.grow-art{display:flex;align-items:flex-end;gap:5px;height:100px}
.grow-art span{flex:1;border-radius:9px;overflow:hidden;background:var(--kid)}
.grow-art img{width:100%;height:100%;object-fit:cover}
.grow-card h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0;line-height:1.1}
.grow-card p{color:var(--ink-2);font-size:15px;margin-top:5px}

.quiet{display:flex;gap:10px;align-items:flex-start;margin-top:26px;color:var(--ink-2);font-size:15px;line-height:1.45}
.quiet svg{width:20px;height:20px;flex:none;color:var(--ink-3);margin-top:1px}
.quiet b{color:var(--ink);font-weight:600}
.home-foot{margin-top:6px}

/* ---------- welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:30px 6px 10px}
.welcome .candles{margin:0 0 34px}
.welcome h1{font-family:var(--serif);font-size:40px;line-height:1.05;font-weight:600;margin:0;letter-spacing:-.01em}
.welcome .lede{font-size:19px;line-height:1.45;color:var(--ink-2);margin:16px 0 34px;max-width:24em}
.welcome .fine{color:var(--ink-3);font-size:14px;margin-top:16px;text-align:center}

/* ---------- child page */
.child-head{display:flex;gap:18px;align-items:center;margin:4px 0 0}
.avatar{width:92px;height:92px;border-radius:50%;overflow:hidden;background:var(--kid);flex:none}
.avatar .initial{font-size:38px}
.avatar img{width:100%;height:100%;object-fit:cover}
.child-name{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.02;margin:0;letter-spacing:-.01em}
.child-sub{color:var(--ink-2);font-size:15px;margin-top:5px}
.child-candles{margin-top:22px}
.hint{color:var(--ink-3);font-size:13px;margin-top:6px;line-height:1.4}
.child-actions{margin-top:22px}
.section-title{font-family:var(--serif);font-size:23px;font-weight:600;margin:38px 0 16px;line-height:1.15}
.empty{color:var(--ink-2);font-size:16px;line-height:1.5}
.empty .btn{margin-top:16px}

.tl-item{position:relative;display:grid;grid-template-columns:58px 1fr;gap:12px;width:100%;text-align:left;padding-bottom:26px}
.tl-item::before{content:"";position:absolute;left:28px;top:58px;bottom:8px;width:1px;background:var(--line)}
.tl-item:last-of-type::before{display:none}
.tl-age{font-family:var(--serif);font-size:50px;line-height:.95;color:var(--kid-deep);text-align:center;font-variant-numeric:lining-nums}
.tl-body{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start}
.tl-thumb{position:relative;width:86px;aspect-ratio:3/4;border-radius:15px;overflow:hidden;background:var(--kid);box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.tl-item:active .tl-thumb{transform:scale(.96)}
.tl-thumb img{width:100%;height:100%;object-fit:cover}
.tl-thumb .initial{font-size:30px}
.tl-title{font-weight:600;font-size:17px;margin-top:3px}
.tl-date{color:var(--ink-2);font-size:15px;margin-top:2px}
.tl-meta{color:var(--ink-3);font-size:13px;margin-top:4px}
.tl-note{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:15px;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add-past{margin-top:4px;color:var(--ink-2);font-size:15px;display:inline-flex;gap:8px;align-items:center;padding:8px 0}
.add-past svg{width:18px;height:18px}

/* doorframe */
.door{display:block;width:100%;max-width:360px;height:auto}

/* ---------- interview page */
.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;background:var(--kid);box-shadow:var(--shadow);margin-top:2px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .initial{font-size:96px}
.hero-blank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play-all{position:absolute;left:14px;bottom:14px;display:inline-flex;gap:8px;align-items:center;padding:11px 18px 11px 14px;border-radius:999px;background:rgba(252,250,248,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:600;font-size:16px;color:var(--ink)}
.play-all svg{width:18px;height:18px}
.play-all:active{transform:scale(.97)}
.iv-title{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.02;margin:22px 0 0;letter-spacing:-.01em}
.iv-date{color:var(--ink-2);margin-top:5px;font-size:16px}
.note{display:block;width:100%;text-align:left;margin-top:20px;font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.note.empty-note{color:var(--ink-3);font-style:italic;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;color:var(--ink-2);font-size:15px}
.facts span b{color:var(--ink);font-weight:600}

.answers{border-top:1px solid var(--line)}
.ans{display:grid;grid-template-columns:52px 1fr 36px;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.ans-main{display:contents}
.ans-thumb{width:52px;height:68px;border-radius:11px;overflow:hidden;background:var(--paper-2);position:relative}
.ans-thumb img{width:100%;height:100%;object-fit:cover}
.ans-thumb.add{border:1.5px dashed #CFC7CF;background:transparent;display:grid;place-items:center;color:var(--ink-3)}
.ans-thumb.add svg{width:20px;height:20px}
.ans-thumb.gone{display:grid;place-items:center;color:var(--ink-3);background:var(--paper-2)}
.ans-thumb.gone svg{width:20px;height:20px}
.ans-text{text-align:left;min-width:0}
.ans-q{font-size:16px;line-height:1.3}
.ans-meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.ans-meta.warn{color:var(--kid-deep)}
.ans .icon-btn{width:36px;height:36px}
.ans .icon-btn svg{width:20px;height:20px;color:var(--ink-3)}
.continue{margin-top:20px}
.add-q{margin-top:6px;color:var(--ink-2);font-size:15px;display:inline-flex;gap:8px;align-items:center;padding:10px 0}
.add-q svg{width:18px;height:18px}

.kept{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.kept-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.kept-row svg{width:22px;height:22px;color:var(--ink-2)}
.kept-row .k-title{font-weight:600;font-size:16px}
.kept-row .k-sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.kept-row .ok{color:#4F7A4A}
.kept-row .ok svg{color:#4F7A4A}

/* save options (share sheet launchers) */
.save-opt{display:grid;grid-template-columns:44px 1fr 28px;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.save-opt:first-child{border-top:1px solid var(--line)}
.save-opt .ic{width:44px;height:44px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center}
.save-opt .ic svg{width:24px;height:24px}
.save-opt b{display:block;font-size:17px;font-weight:600}
.save-opt small{display:block;color:var(--ink-2);font-size:14px;line-height:1.4;margin-top:2px}
.save-opt .st svg{width:24px;height:24px;color:#4F7A4A}
.save-opt[disabled]{opacity:.5;pointer-events:none}
.save-opt:active{opacity:.6}

/* ---------- lists (settings, questions) */
.page-title{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.05;margin:2px 0 8px;letter-spacing:-.01em}
.page-lede{color:var(--ink-2);font-size:16px;line-height:1.5;margin-bottom:8px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);min-height:56px}
.row:active{background:linear-gradient(var(--paper-2),var(--paper-2))}
.row .r-title{font-size:17px}
.row .r-sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.row .chev{width:18px;height:18px;color:var(--ink-3)}
.row .r-ic{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.row .r-ic svg{width:22px;height:22px}
.row .mini-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--kid)}
.row .mini-avatar img{width:100%;height:100%;object-fit:cover}
.row .mini-avatar .initial{font-size:18px}
.stat-line{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.stat-line span:last-child{color:var(--ink-2);text-align:right}
.prose{font-size:16px;line-height:1.6;color:var(--ink)}
.prose h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:30px 0 8px;line-height:1.2}
.prose p{margin:0 0 12px;color:var(--ink-2)}
.prose p b{color:var(--ink)}
.prose ol{margin:0 0 12px;padding-left:22px;color:var(--ink-2)}
.prose li{margin-bottom:6px}

.q-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.q-row.off .q-text{color:var(--ink-3)}
.q-text{font-size:16px;line-height:1.35;text-align:left;width:100%}
.q-sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid #CFC7CF;display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.check svg{width:16px;height:16px}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.order-btns{display:flex;gap:2px}
.order-btns .icon-btn{width:36px;height:36px}
.order-btns .icon-btn svg{width:20px;height:20px}
.tag{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}

/* watch me grow chooser */
.chips{display:flex;gap:10px;overflow-x:auto;margin:10px -20px 4px;padding:4px 20px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;flex:none;padding:6px 16px 6px 6px;border-radius:999px;background:var(--paper-2);font-weight:600;font-size:16px}
.chip.no-pic{padding-left:16px}
.chip .mini{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--kid)}
.chip .mini img{width:100%;height:100%;object-fit:cover}
.chip .mini .initial{font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.g-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.g-row[disabled]{opacity:.45}
.g-row:active{opacity:.6}
.g-q{font-family:var(--serif);font-size:19px;line-height:1.3}
.g-meta{color:var(--ink-2);font-size:14px;margin-top:4px}
.g-steps{display:flex;align-items:flex-end;gap:3px;height:34px}
.g-steps i{width:7px;border-radius:3px;background:var(--kid)}

/* ---------- sheets */
#layer{position:fixed;inset:0;z-index:80;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(30,26,33,.38);opacity:0;transition:opacity .32s;pointer-events:auto}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 22px calc(var(--sab) + 22px);transform:translateY(100%);transition:transform .4s var(--ease);pointer-events:auto;box-shadow:0 -12px 40px rgba(30,26,33,.14)}
.sheet.in{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-size:27px;font-weight:600;margin:2px 0 6px;line-height:1.12}
.sheet .sub{color:var(--ink-2);font-size:15px;line-height:1.45;margin-bottom:18px}
.sheet .btn{margin-top:14px}
.sheet .btn + .btn{margin-top:10px}
.field{display:block;margin-bottom:16px}
.field > span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:7px}
.input{display:block;width:100%;min-height:52px;border-radius:15px;border:1px solid var(--line);background:var(--card);padding:13px 15px;font-size:17px;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--ink)}
input[type=date].input{text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea.input{min-height:150px;font-family:var(--serif);font-size:18px;line-height:1.5;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{position:relative}
.unit em{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink-3)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;background:var(--c)}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.photo-pick{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.photo-pick .avatar{width:76px;height:76px}
.photo-pick .avatar .initial{font-size:30px}
.toggle-line{display:flex;gap:12px;align-items:center;padding:6px 0 14px;font-size:16px;text-align:left;width:100%}
.actions-list{border-top:1px solid var(--line);margin-top:6px}
.actions-list button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:15px 2px;border-bottom:1px solid var(--line);font-size:17px}
.actions-list button svg{width:22px;height:22px;color:var(--ink-2);flex:none}
.actions-list button.danger{color:var(--danger)}
.actions-list button.danger svg{color:var(--danger)}
.actions-list button:active{opacity:.55}
.actions-list small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.setup-q{max-height:40vh;overflow-y:auto;border-top:1px solid var(--line);margin-bottom:6px}
.setup-q .q-row{padding:11px 0}
.disclose{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;font-size:16px}
.disclose span:last-child{color:var(--ink-2)}

/* ---------- recorder */
.rec{position:fixed;inset:0;z-index:50;background:#151316;color:#fff;display:none;flex-direction:column}
.rec.open{display:flex}
.rec-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 4px) 8px 6px}
.rec-top .icon-btn{color:#fff}
.rec-top .icon-btn:active{background:rgba(255,255,255,.14)}
.rec-count{font-size:15px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.rec-stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:24px;overflow:hidden;background:#000}
.rec-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rec-stage video.mirror{transform:scaleX(-1)}
.rec-stage .rv{object-fit:contain;background:#000}
.rec-timer{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--rec);color:#fff;padding:4px 13px;border-radius:999px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;z-index:2}
.rec-fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:10px;color:#fff;z-index:2}
.rec-fallback h3{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 4px}
.rec-fallback p{color:rgba(255,255,255,.75);font-size:15px;line-height:1.5;margin:0 0 10px}
.rec-fallback .btn.primary{background:#fff;color:var(--ink)}
.rec-fallback .btn.soft{background:rgba(255,255,255,.14);color:#fff}
.rv-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.rv-play span{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center}
.rv-play svg{width:30px;height:30px;margin-left:4px}
.rec-panel{background:var(--paper);color:var(--ink);border-radius:28px 28px 0 0;margin-top:10px;padding:20px 22px calc(var(--sab) + 16px)}
.rec-q{font-family:var(--serif);font-size:26px;line-height:1.2;font-weight:600;margin:0}
.rec-nudge{color:var(--ink-2);font-size:15px;line-height:1.4;margin-top:8px}
.rec-last{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--paper-2);font-size:14px;font-weight:600}
.rec-last img{width:26px;height:34px;border-radius:7px;object-fit:cover}
.rec-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:18px}
.rec-btn{width:78px;height:78px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center}
.rec-btn i{display:block;width:60px;height:60px;border-radius:50%;background:var(--rec);transition:all .25s var(--ease)}
.rec.recording .rec-btn i{width:28px;height:28px;border-radius:7px}
.rec-btn[disabled]{opacity:.35}
.side-btn{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);min-width:64px;padding:6px}
.side-btn svg{width:26px;height:26px;color:var(--ink)}
.side-btn.right{justify-self:end}
.side-btn:active{opacity:.5}
.rec.recording .side-btn{visibility:hidden}
.review-ctl{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}
.review-ctl .btn{margin:0}

/* ---------- player */
.player{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:none;overflow:hidden}
.player.open{display:block}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.p-tap{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:30% 40% 30%}
.p-cap{position:absolute;left:20px;right:20px;bottom:calc(var(--sab) + 26px);z-index:2;text-shadow:0 1px 10px rgba(0,0,0,.6);transition:opacity .8s;pointer-events:none}
.p-cap b{display:block;font-family:var(--serif);font-size:22px;font-weight:600}
.p-cap span{display:block;font-size:15px;opacity:.85;margin-top:2px}
.p-cap.hide{opacity:0}
.p-card{position:absolute;inset:0;z-index:3;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px;opacity:0;pointer-events:none;transition:opacity .7s ease}
.p-card.show{opacity:1}
.p-card.show.interactive{pointer-events:auto}
.p-card .c-q{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:19px;line-height:1.35;max-width:20em}
.p-card .c-big{font-family:var(--serif);font-size:min(52vw,250px);line-height:.92;color:var(--kid-deep);margin:22px 0 8px;font-variant-numeric:lining-nums}
.p-card .c-l1{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.15}
.p-card .c-l2{color:var(--ink-2);font-size:16px;margin-top:6px}
.p-card .c-qbig{font-family:var(--serif);font-size:33px;line-height:1.2;font-weight:600;max-width:13em}
.p-card .c-small{color:var(--ink-3);font-size:15px;margin-top:16px}
.p-card .c-title{font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:600;max-width:12em}
.p-card .c-note{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:18px;line-height:1.5;max-width:22em;margin-top:20px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.p-card .candles{justify-content:center;margin-bottom:26px}
.p-card .c-btns{width:100%;max-width:340px;margin-top:40px}
.p-card.anim .c-big{animation:rise 1.1s var(--ease) both}
.p-card.anim .c-l1,.p-card.anim .c-l2{animation:rise 1.1s .15s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.p-top{position:absolute;left:0;right:0;top:0;z-index:4;padding:calc(var(--sat) + 10px) 12px 0;display:flex;align-items:center;gap:12px}
.p-bars{flex:1;display:flex;gap:4px}
.p-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
.p-bars span i{display:block;height:100%;width:0;background:#fff}
.p-bars span.done i{width:100%}
.p-top .icon-btn{color:#fff}
.player.on-card .p-bars span{background:rgba(46,42,51,.14)}
.player.on-card .p-bars span i{background:var(--ink)}
.player.on-card .p-top .icon-btn{color:var(--ink)}
.p-paused{position:absolute;inset:0;z-index:2;display:none;place-items:center;pointer-events:none}
.p-paused span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.p-paused svg{width:30px;height:30px;color:#fff}
.player.paused .p-paused{display:grid}
.p-tapplay{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:rgba(0,0,0,.35)}
.p-tapplay span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center}
.p-tapplay svg{width:34px;height:34px;margin-left:5px}
.player.need-tap .p-tapplay{display:grid}

/* ---------- finish */
.finish{position:fixed;inset:0;z-index:55;background:var(--paper);overflow-y:auto;display:none;padding:calc(var(--sat) + 48px) 24px calc(var(--sab) + 30px)}
.finish.open{display:block;animation:fadeIn .6s var(--ease)}
.finish .inner{max-width:520px;margin:0 auto}

<script>
(() => {
'use strict';

/* =========================================================
   Birthday Time Capsule
   Single-file, local-first. Videos are kept in IndexedDB for
   playback; originals are handed to the iPhone share sheet
   (Save to Files / Save Videos) because web apps cannot write
   to iCloud directly.
   ========================================================= */

const APP_ID = 'birthday-time-capsule';
const APP_VERSION = '1.0';
const DB_NAME = 'birthday-time-capsule';

/* ---------- small helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const ALPH = 'abcdefghijkmnpqrstuvwxyz23456789';
const uid = (n = 8) => { const r = crypto.getRandomValues(new Uint8Array(n)); let s = ''; for (const x of r) s += ALPH[x % ALPH.length]; return s; };
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtDate = (s, o = { month: 'long', day: 'numeric', year: 'numeric' }) => parseISO(s).toLocaleDateString(undefined, o);
const fmtMonthYear = s => parseISO(s).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

const fmtDur = s => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const fmtBytes = b => { if (!b) return '0 MB'; const u = ['bytes', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return `${b < 10 && i > 1 ? b.toFixed(1) : Math.round(b)} ${u[i]}`; };
const heightStr = inches => { if (!inches) return ''; const ft = Math.floor(inches / 12); const inch = Math.round((inches - ft * 12) * 2) / 2; return `${ft}′ ${String(inch).replace('.5', '½')}″`; };
function ageOn(birth, on) {
  const b = parseISO(birth), o = parseISO(on);
  let a = o.getFullYear() - b.getFullYear();
  if (o.getMonth() < b.getMonth() || (o.getMonth() === b.getMonth() && o.getDate() < b.getDate())) a--;
  return Math.max(0, a);
}
function birthdayInfo(birth) {
  const b = parseISO(birth), t = parseISO(todayISO());
  let next = new Date(t.getFullYear(), b.getMonth(), b.getDate());
  if (next < t) next = new Date(t.getFullYear() + 1, b.getMonth(), b.getDate());
  let last = new Date(t.getFullYear(), b.getMonth(), b.getDate());
  if (last > t) last = new Date(t.getFullYear() - 1, b.getMonth(), b.getDate());
  return {
    daysUntil: Math.round((next - t) / 864e5),
    daysSince: Math.round((t - last) / 864e5),
    turning: next.getFullYear() - b.getFullYear(),
  };
}
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),

  phone: sv('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>'),

  calendar: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  candle: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.8 2 2.6 3.4 2.6 4.7a2.6 2.6 0 0 1-5.2 0c0-1.3.8-2.7 2.6-4.7z" fill="#F2C35B"/><rect x="9.5" y="11" width="5" height="11" rx="1.2" fill="currentColor"/></svg>',
};

/* ---------- colors */
const COLORS = [
  { id: 'rose',    soft: '#E7B4AA', deep: '#A4564A', name: 'Rose' },
  { id: 'sage',    soft: '#B2C5A6', deep: '#577150', name: 'Sage' },
  { id: 'sky',     soft: '#ADC6DE', deep: '#4A6D90', name: 'Sky' },
  { id: 'butter',  soft: '#EDD59A', deep: '#8A6B1F', name: 'Butter' },
  { id: 'lilac',   soft: '#C9B9DF', deep: '#6C5690', name: 'Lilac' },
  { id: 'apricot', soft: '#F0C2A0', deep: '#9C5D2D', name: 'Apricot' },
];
const colorOf = c => COLORS.find(x => x.id === (c && c.color)) || COLORS[0];
const kidStyle = c => { const k = colorOf(c); return `--kid:${k.soft};--kid-deep:${k.deep}`; };

/* ---------- default questions */
const DEFAULT_QUESTIONS = [
  ['q-intro',   "What's your name, and how old are you today?", 'Name and age', 'Can you show me on your fingers?'],
  ['q-food',    "What's your favorite food?", 'Favorite food', "Is there a food you really don't like?"],
  ['q-toy',     "What's your favorite toy or thing to play with?", 'Favorite toy', 'What do you like to do with it?'],
  ['q-play',    'What do you love doing most?', 'Loves doing', 'Is that inside or outside?'],
  ['q-friends', 'Who are your best friends?', 'Best friends', 'What do you like to do together?'],

  ['q-color',   "What's your favorite color?", 'Favorite color', 'Why that one?', 'child', false],
  ['q-memory',  "What's your favorite memory from this year?", 'Favorite memory', 'Where were you? Who was there?', 'child', false],
  ['q-happy',   'What makes you really happy?', 'Makes me happy', 'And what makes you grumpy?', 'child', false],
  ['q-says',    "What's something Mom or Dad always says?", 'Mom and Dad always say', 'Can you say it like they do?', 'child', false],
  ['q-song',    "What's your favorite song? Can you sing a little?", 'Favorite song', '', 'child', false],
  ['q-super',   'If you could have any superpower, what would it be?', 'Superpower', 'What would you do with it first?', 'child', false],

];

function freshState() {
  return {
    v: 1,
    children: [],
    questions: DEFAULT_QUESTIONS.map(([id, text, short, nudge, who = 'child', active = true]) =>
      ({ id, text, short, nudge, who, active, archived: false, updatedAt: 0 })),
    interviews: [],
    settings: { created: Date.now(), lastChangeAt: 0, lastBackupAt: 0, seenStorage: false },
  };
}

/* =========================================================
   Storage (IndexedDB)
   ========================================================= */
const DB = (() => {
  let db;
  function open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('This browser has no local database.'));
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { const d = r.result; for (const s of ['state', 'images', 'videos']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
      r.onsuccess = () => { db = r.result; db.onversionchange = () => db.close(); res(db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('The app is open in another tab. Close it and try again.'));
    });
  }
  function run(store, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(store, mode); } catch (e) { return rej(e); }
      const s = t.objectStore(store);
      let out;
      const req = fn(s);
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error || new Error('Storage error'));
      t.onabort = () => rej(t.error || new Error('Storage was interrupted'));
    });
  }
  function entries(store) {
    return new Promise((res, rej) => {
      const out = [];
      const t = db.transaction(store, 'readonly');
      const c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    open,
    get: (st, k) => run(st, 'readonly', s => s.get(k)),
    put: (st, k, v) => run(st, 'readwrite', s => s.put(v, k)),
    del: (st, k) => run(st, 'readwrite', s => s.delete(k)),
    keys: st => run(st, 'readonly', s => s.getAllKeys()),
    entries,
  };
})();

let S = freshState();
const IMG = new Map();      // image id -> data URL
const HAVE = new Set();     // clip ids with a video stored on this device

async function loadAll() {
  await DB.open();
  const st = await DB.get('state', 'main');
  if (st && st.v) {
    S = st;
    // add any new default questions introduced later (never removes yours)
    for (const [id, text, short, nudge, who = 'child'] of DEFAULT_QUESTIONS)
      if (!S.questions.find(q => q.id === id)) S.questions.push({ id, text, short, nudge, who, active: false, archived: false, updatedAt: 0 });
    S.settings = Object.assign(freshState().settings, S.settings || {});
  }
  for (const [k, v] of await DB.entries('images')) IMG.set(k, v);
  for (const k of await DB.keys('videos')) HAVE.add(k);
}

async function commit() {
  S.settings.lastChangeAt = Date.now();
  await DB.put('state', 'main', S);
}

async function putImage(id, dataURL) { await DB.put('images', id, dataURL); IMG.set(id, dataURL); }
async function delImage(id) { if (!id) return; IMG.delete(id); try { await DB.del('images', id); } catch {} }

function recBlob(rec) {
  if (!rec) return null;
  if (rec.blob instanceof Blob) return rec.blob;
  if (rec.buf) return new Blob([rec.buf], { type: rec.type || 'video/mp4' });
  return null;
}
async function putVideo(id, blob) {
  const type = blob.type || 'video/mp4';
  try {
    await DB.put('videos', id, { blob, type, size: blob.size, at: Date.now() });
  } catch (e) {
    if (e && e.name === 'QuotaExceededError') throw quotaError();
    // Some WebKit versions refuse certain Blobs; store the bytes instead.
    const buf = await blob.arrayBuffer();
    try { await DB.put('videos', id, { buf, type, size: blob.size, at: Date.now() }); }
    catch (e2) { if (e2 && e2.name === 'QuotaExceededError') throw quotaError(); throw e2; }
  }
  // read back to confirm it is really there
  const check = recBlob(await DB.get('videos', id));
  if (!check || check.size !== blob.size) throw new Error('The video could not be confirmed in storage. Please try again.');
  HAVE.add(id);
}
function quotaError() { const e = new Error('This iPhone is out of room for new videos. Free up space in Settings › General › iPhone Storage, then try again.'); e.name = 'Quota'; return e; }
async function getVideo(id) { return recBlob(await DB.get('videos', id)); }
async function delVideo(id) { HAVE.delete(id); try { await DB.del('videos', id); } catch {} }

async function ensurePersist() {
  try { if (navigator.storage && navigator.storage.persisted && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch {}
}

/* =========================================================
   Lookups
   ========================================================= */
const child = id => S.children.find(c => c.id === id);
const interview = id => S.interviews.find(i => i.id === id);
const question = id => S.questions.find(q => q.id === id);
const kidInterviews = cid => S.interviews.filter(i => i.childId === cid).sort((a, b) => b.date.localeCompare(a.date));
const allClips = () => S.interviews.flatMap(iv => iv.answers.map((a, idx) => ({ iv, a, idx })).filter(x => x.a.clip));
const ivTitle = iv => { const c = child(iv.childId); return `${c ? c.name : ''} at ${iv.age}`; };
const answeredCount = iv => iv.answers.filter(a => a.clip).length;
const nudgeFor = (qid, c) => { const q = question(qid); return q && q.nudge ? q.nudge.replace(/\{name\}/g, c ? c.name : 'them') : ''; };
const shortFor = a => { const q = question(a.qid); return (q && q.short) || a.text; };
const currentAge = c => ageOn(c.birthday, todayISO());
function coverOf(iv) {
  if (iv.cover && IMG.has(iv.cover)) return IMG.get(iv.cover);
  const a = iv.answers.find(x => x.clip && x.clip.thumb && IMG.has(x.clip.thumb) && x.qid !== 'q-parent');
  const b = a || iv.answers.find(x => x.clip && x.clip.thumb && IMG.has(x.clip.thumb));
  return b ? IMG.get(b.clip.thumb) : null;
}
const photoOf = c => (c && c.photo && IMG.has(c.photo)) ? IMG.get(c.photo) : null;
const avatarHTML = (c, cls = 'initial') => { const p = photoOf(c); return p ? `<img src="${p}" alt="">` : `<div class="${cls}">${esc((c.name || '?').trim().charAt(0).toUpperCase())}</div>`; };
const unsavedFiles = () => allClips().filter(x => HAVE.has(x.a.clip.id) && !x.a.clip.savedFiles);
const missingClips = () => allClips().filter(x => !HAVE.has(x.a.clip.id));

/* =========================================================
   Media helpers
   ========================================================= */
function pickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  const c = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch {} }
  return '';
}
function baseType(t, name = '') {
  t = String(t || '').split(';')[0].trim();
  if (t) return t;
  if (/\.mov$/i.test(name)) return 'video/quicktime';
  if (/\.webm$/i.test(name)) return 'video/webm';
  return 'video/mp4';
}
const extFor = t => /quicktime/.test(t) ? 'mov' : /webm/.test(t) ? 'webm' : /3gpp/.test(t) ? '3gp' : 'mp4';

function frameFrom(video, max = 360) {
  try {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    const sc = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.78);
  } catch { return null; }
}
function thumbFromBlob(blob) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
    const url = URL.createObjectURL(blob);
    let done = false;
    const finish = thumb => {
      if (done) return; done = true;
      const duration = isFinite(v.duration) ? v.duration : 0;
      try { v.pause(); } catch {}
      v.remove(); URL.revokeObjectURL(url);
      res({ thumb, duration });
    };
    v.addEventListener('loadedmetadata', () => {
      const d = isFinite(v.duration) ? v.duration : 2;
      try { v.currentTime = Math.min(1, Math.max(0.1, d / 3)); } catch { }
    });
    v.addEventListener('seeked', () => setTimeout(() => finish(frameFrom(v)), 60));
    v.addEventListener('error', () => finish(null));
    setTimeout(() => finish(frameFrom(v)), 9000);
    document.body.appendChild(v);
    v.src = url;
    v.load();
    const p = v.play(); if (p && p.then) p.then(() => v.pause()).catch(() => {});
  });
}
async function imageToDataURL(file, maxW = 720, ratio = 3 / 4) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (ratio) {
      if (sw / sh > ratio) { const nw = sh * ratio; sx = (sw - nw) / 2; sw = nw; }
      else { const nh = sw / ratio; sy = (sh - nh) / 2.6; sh = nh; }
    }
    const w = Math.min(maxW, sw), h = Math.round(w * sh / sw);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', 0.84);
  } finally { URL.revokeObjectURL(url); }
}

function pickFiles({ accept = '*/*', capture = null, multiple = false } = {}) {

    if (capture) inp.setAttribute('capture', capture);
    inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => { const f = [...(inp.files || [])]; inp.remove(); res(f); }, { once: true });
    inp.addEventListener('cancel', () => { inp.remove(); res([]); }, { once: true });
    inp.click();
  });
}

/* ---------- sharing (the bridge to iCloud Drive / Photos) */
function canShareFiles(files) { try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files })); } catch { return false; } }
async function shareOrDownload(files) {
  // navigator.share must start before any await to keep the tap's permission
  if (canShareFiles(files)) { await navigator.share({ files }); return 'shared'; }
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    await wait(350);
  }
  return 'downloaded';
}
const safeName = s => String(s || '').replace(/[\\/:*?"<>|\[\]#%]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
function clipFileName(iv, idx) {
  const a = iv.answers[idx], c = child(iv.childId);
  return `${safeName(c ? c.name : 'Child')} - Age ${iv.age} (${iv.date.slice(0, 4)}) - ${pad(idx + 1)} ${safeName(shortFor(a))} [btc-${a.clip.id}].${extFor(a.clip.mime)}`;
}
function buildBackup() {
  const images = {}; for (const [k, v] of IMG) images[k] = v;
  return { app: APP_ID, kind: 'backup', appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    readme: 'Birthday Time Capsule backup. Holds children, questions, notes, and which video belongs to which answer. Videos are saved separately; their file names contain [btc-…] codes that match the clip ids in this file.',
    state: S, images };
}
function backupFile() {
  const d = new Date();
  const stamp = `${isoOf(d)} ${pad(d.getHours())}${pad(d.getMinutes())}`;
  return new File([JSON.stringify(buildBackup())], `Birthday Time Capsule backup ${stamp}.json`, { type: 'application/json' });
}
async function prepareClipFiles(iv, dest) {
  // returns [{file, a}] for clips present on this device
  const list = iv.answers.map((a, idx) => ({ a, idx })).filter(x => x.a.clip && HAVE.has(x.a.clip.id));
  const key = dest === 'photos' ? 'savedPhotos' : 'savedFiles';
  let pick = list.filter(x => !x.a.clip[key]);
  if (!pick.length) pick = list;
  if (dest === 'photos') pick = pick.filter(x => !/webm/.test(x.a.clip.mime));
  const out = [];
  for (const x of pick) {
    const blob = await getVideo(x.a.clip.id);
    if (!blob) continue;
    out.push({ a: x.a, file: new File([blob], clipFileName(iv, x.idx), { type: baseType(x.a.clip.mime) }) });
  }

}

let toastT;

const layer = () => $('#layer');
function sheet(html, { onMount, style = '', cls = '' } = {}) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" style="${style}"><div class="grabber"></div>${html}</div>`;
  const scrim = wrap.firstElementChild, el = wrap.lastElementChild;
  layer().appendChild(scrim); layer().appendChild(el);
  let closed = false;
  const api = {
    el,
    close() {
      if (closed) return; closed = true;
      el.classList.remove('in'); scrim.classList.remove('in');
      setTimeout(() => { el.remove(); scrim.remove(); }, 420);
    },
  };
  scrim.addEventListener('click', () => api.close());
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) api.close(); });
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('in'); scrim.classList.add('in'); }));
  if (onMount) onMount(el, api);
  return api;
}
function actionSheet(title, items, { sub = '', style = '' } = {}) {

    <div class="actions-list">${items.map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.icon || ''}<span>${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></button>`).join('')}</div>

  return sheet(html, {
    style,
    onMount(el, api) {

}

/* =========================================================
   Navigation
   ========================================================= */
const stack = [];
const VIEWS = {};
function renderEntry(entry, keepScroll = false) {
  const top = entry.el.scrollTop;
  const out = VIEWS[entry.name](entry.params || {});
  if (out == null) return false;
  const res = typeof out === 'string' ? { html: out } : out;
  entry.el.innerHTML = res.html;
  entry.el.setAttribute('style', res.style || '');
  if (keepScroll) entry.el.scrollTop = top;
  entry.dirty = false;
  return true;
}
function go(name, params = {}) {
  const entry = { name, params, el: document.createElement('section') };
  entry.el.className = 'view from-right';
  if (!renderEntry(entry)) return;
  const prev = stack[stack.length - 1];
  $('#views').appendChild(entry.el);
  stack.push(entry);
  entry.el.getBoundingClientRect();
  requestAnimationFrame(() => {
    entry.el.classList.remove('from-right');
    if (prev) { prev.el.classList.add('to-left'); setTimeout(() => { if (stack.includes(prev) && stack[stack.length - 1] !== prev) prev.el.classList.add('behind'); }, 460); }
  });
}
function back() {
  if (stack.length < 2) return;
  const cur = stack.pop();
  const prev = stack[stack.length - 1];
  if (prev.dirty) renderEntry(prev, true);
  prev.el.classList.remove('behind');
  prev.el.getBoundingClientRect();
  requestAnimationFrame(() => { prev.el.classList.remove('to-left'); cur.el.classList.add('from-right'); });
  setTimeout(() => cur.el.remove(), 460);
}
function home() {
  while (stack.length > 1) { const e = stack.pop(); e.el.remove(); }
  const h = stack[0];
  h.el.classList.remove('to-left', 'behind');
  renderEntry(h);
}
function refresh() {
  stack.forEach((e, i) => { if (i === stack.length - 1) { if (!renderEntry(e, true)) back(); } else e.dirty = true; });
}
function resetTo(name, params) {
  for (const e of stack) e.el.remove();
  stack.length = 0;
  const entry = { name, params, el: document.createElement('section') };
  entry.el.className = 'view fade-in';
  renderEntry(entry);
  $('#views').appendChild(entry.el);
  stack.push(entry);
}

/* =========================================================
   Candles (one per year; lit when that birthday has an interview)
   ========================================================= */
function candlesHTML(c, size = '') {
  const age = currentAge(c);
  const lit = new Set(S.interviews.filter(i => i.childId === c.id && answeredCount(i) > 0).map(i => i.age));
  const bd = birthdayInfo(c.birthday);
  if (age === 0) return `<div class="candles ${size}" aria-label="First birthday still ahead"><span class="candle ghost"><i></i></span></div>`;
  const n = Math.min(age, size === 'xl' ? 12 : 21);
  let h = '';
  for (let a = age - n + 1; a <= age; a++) {
    const isLit = lit.has(a);
    h += `<span class="candle ${isLit ? 'lit' : ''} ${isLit && a === age && bd.daysSince <= 7 ? 'now' : ''}" title="Age ${a}${isLit ? ', interview recorded' : ''}"><i></i></span>`;
  }
  return `<div class="candles ${size}" aria-label="${lit.size} of ${age} birthdays recorded">${h}</div>`;
}

function growCardHTML() {
  // four ascending tiles: real thumbnails of one question across years when they exist
  let tiles = [];
  for (const qid of ['q-grow', 'q-intro', 'q-food']) {
    for (const c of S.children) {
      const t = S.interviews.filter(i => i.childId === c.id).sort((a, b) => a.age - b.age)
        .map(i => i.answers.find(a => a.qid === qid && a.clip && a.clip.thumb && IMG.has(a.clip.thumb))).filter(Boolean).map(a => ({ src: IMG.get(a.clip.thumb), c }));
      if (t.length > tiles.length) tiles = t;
    }
    if (tiles.length >= 2) break;
  }
  tiles = tiles.slice(-4);
  const heights = [46, 62, 80, 100];
  const fill = 4 - tiles.length;
  const kidsCycle = S.children.length ? S.children : [{ color: 'rose' }];
  let art = '';
  for (let i = 0; i < 4; i++) {
    const t = i >= fill ? tiles[i - fill] : null;
    const c = t ? t.c : kidsCycle[i % kidsCycle.length];
    art += `<span style="height:${heights[i]}%;${kidStyle(c)}">${t ? `<img src="${t.src}" alt="">` : ''}</span>`;
  }
  return `<button class="grow-card" data-act="grow">
    <div class="grow-art">${art}</div>
    <div><h2>Watch Me Grow</h2><p>Pick one question and watch every birthday's answer, one after another.</p></div>
  </button>`;
}

function doorframeHTML(c) {

  const W = 340, H = Math.max(200, 60 + pts.length * 22);
  const lo = Math.min(...pts.map(p => p.heightIn)) - 4, hi = Math.max(...pts.map(p => p.heightIn)) + 3;
  const y = v => 20 + (H - 40) * (1 - (v - lo) / Math.max(1, hi - lo));
  const k = colorOf(c);
  let marks = '';
  let lastY = -Infinity;
  for (const p of pts.slice().sort((a, b) => b.heightIn - a.heightIn)) {
    const yy = y(p.heightIn);
    const ly = Math.min(H - 8, Math.max(yy, lastY + 20)); lastY = ly;
    marks += `<line x1="34" x2="104" y1="${yy}" y2="${yy}" stroke="#6F6877" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M104 ${yy} L118 ${ly}" stroke="#D9D2CC" stroke-width="1"/>
      <text x="124" y="${ly + 5}" font-family="ui-serif, Georgia, serif" font-size="16" fill="#2E2A33">${p.age}</text>
      <text x="150" y="${ly + 5}" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#6F6877">${esc(heightStr(p.heightIn))}, ${esc(fmtMonthYear(p.date))}</text>`;
  }
  return `<svg class="door" viewBox="0 0 ${W} ${H}" role="img" aria-label="Height on each birthday">
    <rect x="30" y="4" width="78" height="${H - 8}" rx="6" fill="#F2E8DB"/>
    <rect x="30" y="4" width="8" height="${H - 8}" rx="3" fill="#E7DACA"/>

  </svg>`;
}

  if (left) h += `<div class="continue"><button class="btn primary" data-act="continue" data-id="${iv.id}">${I.video}<span>${n ? `Continue the interview (${left} left)` : 'Start the interview'}</span></button></div>`;

};

VIEWS.grow = ({ who }) => {
  const kids = S.children;
  if (!who) who = kids.length ? kids[0].id : 'all';
  const sel = who === 'all' ? kids : kids.filter(k => k.id === who);
  const c0 = who === 'all' ? null : sel[0];
  let h = `<div class="bar"><button class="back" data-act="back">${I.back}<span>Back</span></button><span></span></div>
    <h1 class="page-title">Watch Me Grow</h1>
    <p class="page-lede">Choose a question. Each birthday's answer plays in order, youngest to oldest.</p>
    <div class="chips" role="group" aria-label="Whose answers">
      ${kids.map(k => `<button class="chip" aria-pressed="${who === k.id}" data-act="grow-who" data-who="${k.id}" style="${kidStyle(k)}"><span class="mini">${avatarHTML(k)}</span>${esc(k.name)}</button>`).join('')}
      ${kids.length > 1 ? `<button class="chip no-pic" aria-pressed="${who === 'all'}" data-act="grow-who" data-who="all">Together</button>` : ''}
    </div>`;
  // questions in library order, plus one-off questions that have answers
  const qmap = new Map();
  for (const q of S.questions.filter(q => !q.archived)) qmap.set(q.id, { id: q.id, text: q.text, items: [] });
  for (const iv of S.interviews) {
    if (!sel.find(k => k.id === iv.childId)) continue;
    for (const a of iv.answers) {
      if (!a.clip) continue;
      if (!qmap.has(a.qid)) qmap.set(a.qid, { id: a.qid, text: a.text, items: [] });
      qmap.get(a.qid).items.push({ iv, a });
    }
  }
  const rows = [...qmap.values()].filter(r => r.items.length || question(r.id)?.active);
  rows.sort((a, b) => (b.items.length > 0) - (a.items.length > 0));
  if (!rows.some(r => r.items.length)) {
    h += `<div class="empty" style="margin-top:20px"><p>Nothing to watch yet. After the first birthday interview, every question becomes a reel. It gets better each year.</p></div>`;
  }
  h += `<div class="list" style="margin-top:8px">`;
  for (const r of rows) {
    const ages = [...new Set(r.items.map(x => x.iv.age))].sort((a, b) => a - b);
    const n = r.items.length;
    let meta = 'No answers yet';
    if (n) meta = who === 'all' ? `${plural(n, 'answer')}, ages ${ages[0]}${ages.length > 1 ? `–${ages[ages.length - 1]}` : ''}`
      : ages.length === 1 ? `Age ${ages[0]}` : `Ages ${ages[0]} to ${ages[ages.length - 1]}, ${plural(n, 'birthday')}`;
    const steps = r.items.slice().sort((a, b) => a.iv.age - b.iv.age).slice(-8).map((x, i, arr) => `<i style="height:${30 + 70 * ((i + 1) / arr.length)}%;${kidStyle(child(x.iv.childId))}"></i>`).join('');
    h += `<button class="g-row" data-act="grow-play" data-q="${esc(r.id)}" data-who="${who}" ${n ? '' : 'disabled'}>
      <div><p class="g-q">${esc(r.text)}</p><p class="g-meta">${meta}</p></div>
      <div class="g-steps" aria-hidden="true">${steps}</div></button>`;
  }
  h += `</div>`;
  return { html: h, style: c0 ? kidStyle(c0) : '' };
};

async function fillStorageStats() {
  const el = $('#storage-stats'); if (!el) return;
  let used = '', persisted = 'Unknown';
  try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); used = fmtBytes(e.usage || 0); } } catch {}
  try { if (navigator.storage?.persisted) persisted = (await navigator.storage.persisted()) ? 'Yes' : 'Not granted'; } catch {}
  const vids = HAVE.size;
  el.innerHTML = `
    <div class="stat-line"><span>Videos stored in the app</span><span>${vids}${used ? `, ${used}` : ''}</span></div>

function childForm(c, { onDone } = {}) {
  const isNew = !c;
  const draft = c ? { ...c } : { id: 'c-' + uid(6), name: '', birthday: '', color: COLORS[S.children.length % COLORS.length].id, photo: null };
  let photoData = draft.photo && IMG.get(draft.photo) || null;
  const s = sheet(`
    <h2>${isNew ? 'Add a child' : `Edit ${esc(c.name)}`}</h2>
    <div class="photo-pick"><div class="avatar" id="cf-av" style="${kidStyle(draft)}">${photoData ? `<img src="${photoData}" alt="">` : `<div class="initial">${esc((draft.name || '+').charAt(0).toUpperCase())}</div>`}</div>
      <button class="text-btn" id="cf-photo" style="padding-left:0">${photoData ? 'Change photo' : 'Add a photo'}</button></div>
    <label class="field"><span>Name</span><input class="input" id="cf-name" value="${esc(draft.name)}" autocomplete="off" autocapitalize="words" placeholder="First name"></label>
    <label class="field"><span>Birthday</span><input class="input" id="cf-bday" type="date" value="${esc(draft.birthday)}" max="${todayISO()}"></label>
    <div class="field"><span>Color</span><div class="swatches">${COLORS.map(k => `<button class="swatch" style="--c:${k.soft}" data-color="${k.id}" aria-label="${k.name}" aria-pressed="${draft.color === k.id}"></button>`).join('')}</div></div>
    <button class="btn primary" id="cf-save">${isNew ? 'Add child' : 'Save'}</button>
    ${isNew ? '<button class="btn soft" data-close>Cancel</button>' : `<button class="btn danger" id="cf-del">Remove ${esc(c.name)}</button>`}
  `, {
    style: kidStyle(draft),
    onMount(el, api) {
      const av = $('#cf-av', el);
      const setAv = () => { av.setAttribute('style', kidStyle(draft)); av.innerHTML = photoData ? `<img src="${photoData}" alt="">` : `<div class="initial">${esc(($('#cf-name', el).value || '+').charAt(0).toUpperCase())}</div>`; };
      $('#cf-name', el).addEventListener('input', setAv);
      $$('.swatch', el).forEach(b => b.addEventListener('click', () => { draft.color = b.dataset.color; $$('.swatch', el).forEach(x => x.setAttribute('aria-pressed', x === b)); setAv(); }));
      $('#cf-photo', el).addEventListener('click', () => {
        pickFiles({ accept: 'image/*' }).then(async f => {
          if (!f[0]) return;
          try { photoData = await imageToDataURL(f[0], 720, 3 / 4); setAv(); $('#cf-photo', el).textContent = 'Change photo'; }
          catch { toast("That photo couldn't be opened. Try another."); }
        });
      });
      $('#cf-save', el).addEventListener('click', async () => {
        const name = $('#cf-name', el).value.trim(), bday = $('#cf-bday', el).value;
        if (!name) { $('#cf-name', el).focus(); toast('Add a name first.'); return; }
        if (!bday) { $('#cf-bday', el).focus(); toast('Add a birthday so ages work out.'); return; }
        draft.name = name; draft.birthday = bday; draft.updatedAt = Date.now();
        if (photoData && photoData !== (draft.photo && IMG.get(draft.photo))) {
          const pid = 'p-' + draft.id + '-' + uid(4);
          await putImage(pid, photoData);
          if (draft.photo) await delImage(draft.photo);
          draft.photo = pid;
        }
        if (isNew) S.children.push(draft); else Object.assign(c, draft);
        await commit(); ensurePersist();
        api.close();
        if (isNew && S.children.length === 1) { resetTo('home'); setTimeout(afterFirstChild, 450); }
        else { refresh(); if (onDone) setTimeout(onDone, 450); else if (isNew) maybeStorageIntro(); }
      });
      if (!isNew) $('#cf-del', el).addEventListener('click', () => {
        const ivs = S.interviews.filter(i => i.childId === c.id);
        const vids = ivs.reduce((n, i) => n + answeredCount(i), 0);
        api.close();
        confirmSheet({ title: `Remove ${c.name}?`, sub: `This removes ${plural(ivs.length, 'birthday')} and ${plural(vids, 'video')} from this app. Anything you saved to iCloud Drive or Photos stays there.`, ok: `Remove ${c.name}`,
          async onOk() {
            for (const iv of ivs) await deleteInterviewData(iv);
            S.interviews = S.interviews.filter(i => i.childId !== c.id);
            await delImage(c.photo);
            S.children = S.children.filter(x => x.id !== c.id);
            await commit(); home(); toast(`${c.name} was removed.`);
          } });
      });
    },
  });
  return s;
}

    <h2 id="su-title">${esc(title())}</h2>

    <label class="field"><span>Date of the interview</span><input class="input" type="date" id="su-date" value="${date}" min="${c.birthday}" max="${todayISO()}"></label>
    <button class="disclose" id="su-toggle"><span>Questions</span><span id="su-count"></span></button>
    <div id="su-list" hidden>
      <div class="setup-q">${qs.map(q => `<div class="q-row"><button class="check ${chosen.has(q.id) ? 'on' : ''}" data-q="${q.id}" aria-pressed="${chosen.has(q.id)}">${I.check}</button><p class="q-text">${esc(q.text)}</p><span></span></div>`).join('')}</div>
      <label class="field" style="margin-top:12px"><span>A question just for this year</span><input class="input" id="su-extra" placeholder="e.g. What was your favorite part of the beach trip?"></label>
      <button class="toggle-line" id="su-every"><span class="check" id="su-every-c">${I.check}</span><span>Ask it every year</span></button>
    </div>
    <button class="btn primary" id="su-go">${I.video}<span>${past ? 'Create this birthday' : 'Start the interview'}</span></button>
    <button class="btn soft" data-close>Cancel</button>
  `, {
    style: kidStyle(c),
    onMount(el, api) {
      let every = false;
      const upd = () => {
        $('#su-title', el).textContent = title();
        $('#su-count', el).textContent = `${chosen.size} chosen`;
        const a = ageOn(c.birthday, date);
        const exists = S.interviews.find(i => i.childId === c.id && i.age === a);
        $('#su-sub', el).textContent = exists ? `There's already an interview for age ${a}. Starting will continue it.` : past ? 'Pick the birthday date. You can record now or add videos you already have.' : 'Questions appear one at a time. Record each answer, then keep it or try again.';
      };
      upd();
      $('#su-date', el).addEventListener('change', e => { if (e.target.value) { date = e.target.value; upd(); } });
      $('#su-toggle', el).addEventListener('click', () => { const l = $('#su-list', el); l.hidden = !l.hidden; });
      $$('.setup-q .check', el).forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.q; chosen.has(id) ? chosen.delete(id) : chosen.add(id);
        b.classList.toggle('on', chosen.has(id)); b.setAttribute('aria-pressed', chosen.has(id)); upd();
      }));
      $('#su-every', el).addEventListener('click', () => { every = !every; $('#su-every-c', el).classList.toggle('on', every); });
      $('#su-go', el).addEventListener('click', async () => {
        const a = ageOn(c.birthday, date);
        if (a < 1 && !past) { /* first-year interviews are allowed but unusual */ }
        const ex = $('#su-extra', el).value.trim();
        if (ex) {
          const qid = (every ? 'q-' : 'x-') + uid(6);
          if (every) S.questions.push({ id: qid, text: ex, short: ex.slice(0, 28), nudge: '', who: 'child', active: true, archived: false, updatedAt: Date.now() });
          extra.push({ qid, text: ex, who: 'child', clip: null });
        }
        let iv = S.interviews.find(i => i.childId === c.id && i.age === a);
        if (!iv) {
          iv = { id: 'iv-' + uid(8), childId: c.id, date, age: a, note: '', heightIn: null, cover: null, createdAt: Date.now(), updatedAt: Date.now(),
            answers: qs.filter(q => chosen.has(q.id)).map(q => ({ qid: q.id, text: q.text, who: q.who, clip: null })) };
          S.interviews.push(iv);
        } else {
          for (const q of qs) if (chosen.has(q.id) && !iv.answers.some(x => x.qid === q.id)) iv.answers.push({ qid: q.id, text: q.text, who: q.who, clip: null });
        }
        iv.answers.push(...extra);
        // keep the parent message last
        iv.answers.sort((x, y) => (x.who === 'parent') - (y.who === 'parent'));
        iv.updatedAt = Date.now();
        await commit(); ensurePersist();
        api.close();
        if (past) { go('interview', { id: iv.id }); return; }
        const todo = iv.answers.map((x, i) => i).filter(i => !iv.answers[i].clip);
        if (!todo.length) { go('interview', { id: iv.id }); return; }
        Rec.open(iv.id, todo);
      });
    },
  });
}

function mountSavePanel(host, iv) {
  const state = { files: null, photos: null };
  const withVid = () => iv.answers.filter(a => a.clip && HAVE.has(a.clip.id));
  const render = (busy) => {
    const all = withVid();
    const sf = all.length && all.every(a => a.clip.savedFiles), sp = all.length && all.every(a => a.clip.savedPhotos);
    host.innerHTML = `
      <button class="save-opt" data-dest="files" ${busy || !state.files ? 'disabled' : ''}><span class="ic">${I.cloud}</span>
        <span><b>${sf ? 'Saved to iCloud Drive' : 'Save to iCloud Drive'}</b><small>${state.files ? `Choose Save to Files, then your Birthday Time Capsule folder. ${plural(state.files.length, 'video')} plus the backup file.` : 'Getting the videos ready…'}</small></span>
        <span class="st">${sf ? I.check : !state.files ? '<span class="spinner"></span>' : ''}</span></button>
      <button class="save-opt" data-dest="photos" ${busy || !state.photos || !state.photos.length ? 'disabled' : ''}><span class="ic">${I.photos}</span>
        <span><b>${sp ? 'Saved to Photos' : 'Save to Photos'}</b><small>${state.photos ? (state.photos.length ? `Choose Save ${state.photos.length === 1 ? 'Video' : `${state.photos.length} Videos`}.` : 'These videos can’t go to Photos.') : 'Getting the videos ready…'}</small></span>
        <span class="st">${sp ? I.check : !state.photos ? '<span class="spinner"></span>' : ''}</span></button>`;
    $$('.save-opt', host).forEach(b => b.addEventListener('click', () => doSave(b.dataset.dest)));
  };
  const doSave = dest => {
    const list = state[dest]; if (!list) return;
    let files = list.map(x => x.file);
    let withBackup = false;
    if (dest === 'files') {
      const withB = files.concat(backupFile());
      if (canShareFiles(withB) || !canShareFiles(files)) { files = withB; withBackup = true; }
    }
    shareOrDownload(files).then(async how => {
      const key = dest === 'files' ? 'savedFiles' : 'savedPhotos';
      const now = Date.now();
      for (const x of list) x.a.clip[key] = now;
      iv.updatedAt = now;
      S.settings.lastChangeAt = now;
      if (withBackup) S.settings.lastBackupAt = now + 1;
      await DB.put('state', 'main', S);
      toast(how === 'downloaded' ? 'Downloaded.' : dest === 'files' ? (withBackup ? 'Saved. Check the Files app if you want to be sure.' : 'Videos saved. Save the backup file from Backup and restore too.') : 'Sent to Photos.', 3600);
      await prep(); refresh();
    }).catch(e => {
      if (e && e.name === 'AbortError') return;
      messageSheet("That didn't finish", `The share sheet reported: ${e && e.message ? e.message : 'unknown error'}. Try again, or save fewer videos at a time from each answer's menu.`);
    });
  };
  const prep = async () => {
    state.files = null; state.photos = null; render(false);
    try {
      state.files = await prepareClipFiles(iv, 'files');
      state.photos = await prepareClipFiles(iv, 'photos');
    } catch (e) { state.files = state.files || []; state.photos = state.photos || []; }
    render(false);
  };
  prep();
}
